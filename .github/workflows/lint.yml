name: Lint

permissions:
  checks: write
  pull-requests: write

on:
  push:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install  --frozen-lockfile
      - run: bun add -g eslint@9.39.1
      - name: Install pre-commit
        run: |
          sudo apt-get update
          sudo apt-get install -y pre-commit
      - name: Run pre-commit
        run: |
          git config --global --add safe.directory $(pwd)
          pre-commit run --all
