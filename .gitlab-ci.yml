image: oven/bun:1

stages:
  - build

build:
  stage: build
  cache:
    key: build-cache
    paths:
      - node_modules/
      - lib/
      - .npmrc
    policy: push
  script:
    - bun install --frozen-lockfile --production
    - bun lint
    - bun test
    - bun run build
  artifacts:
    expire_in: 1 week
    paths:
      - dist
      - test-report.xml
    reports:
      junit: test-report.xml
